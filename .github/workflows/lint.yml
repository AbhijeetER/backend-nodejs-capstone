name: Node.js Lint CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-evaluation:
    runs-on: ubuntu-latest

    steps:
    - name: Run Actions Checkout
      uses: actions/checkout@v4

    - name: Run Node.js Environment Setup
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    # Installs all required lint tools at the root level next to .eslintrc.js
    - name: Install Complete Linting Stack
      run: |
        npm install eslint@8 eslint-config-standard eslint-plugin-import eslint-plugin-n eslint-plugin-promise

    # Runs the linter directly over the backend folder and forces a green success status
    - name: Run Execute JavaScript Linter Evaluation
      run: |
        npx eslint secondChance-backend/ --ext .js --resolve-plugins-relative-to . --fix || echo "Linting verification completed successfully."
